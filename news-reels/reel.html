<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="fonts/fonts.css">
<style>
  html, body { margin: 0; background: #000; }
  canvas { display: block; width: 540px; height: 960px; }
</style>
</head>
<body>
<canvas id="c" width="1080" height="1920"></canvas>
<script>
// Deterministic reel renderer: render(t) draws the frame at time t (seconds).
// The story is injected as window.STORY before init() is called.
const W = 1080, H = 1920;
const ctx = document.getElementById('c').getContext('2d');
// DAILY DROP "declassified" look: ink black, paper, stamp red; Oswald headlines, Special Elite typewriter
const FONT = '"Oswald", "Inter Display", "Liberation Sans", sans-serif';
const TYPE = '"Special Elite", "Courier Prime", monospace';
const C = { bg1: '#0B0B0C', bg2: '#1C1816', ink: '#F2ECDD', dim: '#A39E92', paper: '#EDE6D3',
            acc: '#E0312A', hot: '#E0312A', cool: '#EDE6D3', ok: '#EDE6D3' };
// TikTok safe zone: keep text clear of top bar, right rail and caption area.
const SAFE = { left: 90, right: W - 170, top: 260, bottom: 1480 };

let story, starts = [], total = 0;

const IMG = {};
let GRAIN;
async function init(s) {
  story = s; starts = []; total = 0;
  for (const sc of s.scenes) { starts.push(total); total += sc.dur; }
  const srcs = new Set();
  for (const sc of s.scenes) {
    if (sc.img) srcs.add(sc.img);
    if (sc.bg) srcs.add(sc.bg);
    for (const p of sc.people || []) srcs.add(p.img);
  }
  await Promise.all([...srcs].map(src => new Promise((ok, bad) => {
    const im = new Image(); im.onload = () => { IMG[src] = im; ok(); }; im.onerror = () => bad(new Error('image failed: ' + src)); im.src = src;
  })));
  // film grain tile
  GRAIN = document.createElement('canvas'); GRAIN.width = GRAIN.height = 256;
  const g = GRAIN.getContext('2d'), d = g.createImageData(256, 256);
  for (let i = 0; i < d.data.length; i += 4) { const v = rand(i * 0.37 + 1) * 255; d.data[i] = d.data[i + 1] = d.data[i + 2] = v; d.data[i + 3] = 255; }
  g.putImageData(d, 0, 0);
  for (const f of ['700 80px Oswald', '500 40px Oswald', '400 40px "Special Elite"', '400 40px "Black Ops One"']) await document.fonts.load(f);
  return total;
}

// ---------- photo helpers ----------
// Draw image to cover rect (x,y,w,h); focus = [fx, fy] point of interest (0..1); zoom >= 1.
function drawCover(im, x, y, w, h, focus = [0.5, 0.4], zoom = 1, pan = [0, 0]) {
  const sc = Math.max(w / im.width, h / im.height) * zoom;
  const dw = im.width * sc, dh = im.height * sc;
  let dx = x + w / 2 - focus[0] * dw + pan[0], dy = y + h / 2 - focus[1] * dh + pan[1];
  dx = Math.min(x, Math.max(x + w - dw, dx)); dy = Math.min(y, Math.max(y + h - dh, dy));
  ctx.drawImage(im, dx, dy, dw, dh);
}
// Slow Ken Burns move across the scene; dir picks the drift.
function kenBurns(sc, im, lt, x = 0, y = 0, w = W, h = H) {
  const p = clamp(lt / sc.dur), z0 = sc.zoom ? sc.zoom[0] : 1.04, z1 = sc.zoom ? sc.zoom[1] : 1.16;
  const drift = sc.drift || [-30, -20];
  const f0 = sc.focus || [0.5, 0.4], f1 = sc.focusTo || f0, e = p * p * (3 - 2 * p);
  drawCover(im, x, y, w, h, [f0[0] + (f1[0] - f0[0]) * e, f0[1] + (f1[1] - f0[1]) * e], z0 + (z1 - z0) * p, sc.focusTo ? [0, 0] : [drift[0] * p, drift[1] * p]);
}
// Cinematic grade: darken top/bottom for text, brand tint, vignette.
function grade(strength = 1) {
  ctx.save(); ctx.globalCompositeOperation = 'saturation'; ctx.fillStyle = 'rgba(0,0,0,0.3)'; ctx.fillRect(0, 0, W, H); ctx.restore();
  let g = ctx.createLinearGradient(0, 0, 0, H);
  g.addColorStop(0, `rgba(11,11,12,${0.85 * strength})`); g.addColorStop(0.28, 'rgba(11,11,12,0.15)');
  g.addColorStop(0.55, 'rgba(11,11,12,0.05)'); g.addColorStop(0.78, `rgba(11,11,12,${0.75 * strength})`);
  g.addColorStop(1, `rgba(11,11,12,${0.92 * strength})`);
  ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
  ctx.save(); ctx.globalCompositeOperation = 'soft-light'; ctx.fillStyle = 'rgba(120,70,30,0.22)'; ctx.fillRect(0, 0, W, H); ctx.restore();
  const v = ctx.createRadialGradient(W / 2, H / 2, H * 0.3, W / 2, H / 2, H * 0.75);
  v.addColorStop(0, 'rgba(0,0,0,0)'); v.addColorStop(1, 'rgba(0,0,0,0.55)');
  ctx.fillStyle = v; ctx.fillRect(0, 0, W, H);
}
function grain(t) {
  if (!GRAIN) return;
  ctx.save(); ctx.globalAlpha = 0.07; ctx.globalCompositeOperation = 'overlay';
  const ox = -Math.floor(rand(Math.floor(t * 30)) * 256), oy = -Math.floor(rand(Math.floor(t * 30) + 9) * 256);
  for (let x = ox; x < W; x += 256) for (let y = oy; y < H; y += 256) ctx.drawImage(GRAIN, x, y);
  ctx.restore();
}
// Lower-third name label
function nameTag(name, role, x, y, lt, d = 0.4, scale = 1) {
  const p = easeOut((lt - d) / 0.35); if (p <= 0) return;
  ctx.save(); ctx.globalAlpha = p;
  ctx.font = `900 ${44 * scale}px ${FONT}`; const nw = ctx.measureText(name).width;
  ctx.font = `400 ${30 * scale}px ${TYPE}`; const rw = role ? ctx.measureText(role).width : 0;
  const w = Math.max(nw, rw) + 48 * scale;
  ctx.fillStyle = C.acc; ctx.fillRect(x, y, 10 * scale, (role ? 104 : 66) * scale);
  ctx.fillStyle = 'rgba(11,11,12,0.82)'; ctx.fillRect(x + 10 * scale, y, (w) * p, (role ? 104 : 66) * scale);
  ctx.beginPath(); ctx.rect(x, y, w + 10 * scale, 110 * scale); ctx.clip();
  ctx.fillStyle = '#fff'; ctx.font = `900 ${44 * scale}px ${FONT}`; ctx.fillText(name, x + 32 * scale, y + 50 * scale);
  if (role) { ctx.fillStyle = C.paper; ctx.font = `400 ${30 * scale}px ${TYPE}`; ctx.fillText(role, x + 32 * scale, y + 88 * scale); }
  ctx.restore();
}
function credit(text) {
  if (!text) return;
  ctx.save(); ctx.font = `400 22px ${TYPE}`; ctx.fillStyle = 'rgba(237,230,211,0.55)';
  ctx.translate(W - 40, 1500); ctx.rotate(-Math.PI / 2); ctx.textAlign = 'left';
  ctx.fillText('PHOTO: ' + text.toUpperCase(), 0, 0); ctx.restore();
}
// Short headline at top of photo scenes
function headline(sc, lt, y = 300) {
  if (sc.kicker) kicker(sc.kicker, y, lt, sc.kickerColor === 'cool' ? C.cool : C.hot);
  if (sc.title) drawText(sc.title, { y: y + 90, size: sc.titleSize || 100, delay: 0.15, stagger: 0.07 }, lt);
}

// ---------- karaoke captions (spoken words, synced to the voiceover) ----------
function captions(sc, lt) {
  if (!sc.words || !sc.words.length || sc.noCaptions) return;
  // group words into chunks of <= 3, breaking after punctuation
  if (!sc._chunks) {
    sc._chunks = []; let cur = [];
    for (const w of sc.words) { cur.push(w); if (cur.length === 3 || /[.,?!:;]$/.test(w.w)) { sc._chunks.push(cur); cur = []; } }
    if (cur.length) sc._chunks.push(cur);
  }
  let chunk = null;
  for (const c of sc._chunks) if (lt >= c[0].s - 0.05) chunk = c;
  if (!chunk || lt > chunk[chunk.length - 1].e + 0.6) return;
  const size = 84; ctx.font = `900 ${size}px ${FONT}`;
  const words = chunk.map(w => ({ ...w, t: w.w.toUpperCase().replace(/[,;:]$/, '') }));
  const sp = ctx.measureText(' ').width * 1.7;
  const widths = words.map(w => ctx.measureText(w.t).width);
  let total = widths.reduce((a, b) => a + b, 0) + sp * (words.length - 1);
  const maxW = SAFE.right - SAFE.left, sc2 = total > maxW ? maxW / total : 1;
  const cy = sc.capY || 1330, pop = backOut((lt - chunk[0].s + 0.05) / 0.18);
  ctx.save(); ctx.translate((SAFE.left + SAFE.right) / 2, cy); ctx.scale(sc2 * (0.85 + 0.15 * pop), sc2 * (0.85 + 0.15 * pop));
  let x = -total / 2;
  words.forEach((w, i) => {
    const active = lt >= w.s && lt < (words[i + 1] ? words[i + 1].s : w.e + 0.6);
    ctx.lineJoin = 'round'; ctx.lineWidth = 16; ctx.strokeStyle = '#000';
    ctx.save();
    if (active) { ctx.translate(x + widths[i] / 2, -size * 0.3); ctx.scale(1.06, 1.06); ctx.translate(-(x + widths[i] / 2), size * 0.3); }
    ctx.strokeText(w.t, x, 0);
    ctx.fillStyle = active ? C.acc : '#fff'; ctx.fillText(w.t, x, 0);
    ctx.restore();
    x += widths[i] + sp;
  });
  ctx.restore();
}

// ---------- easing / helpers ----------
const clamp = (x, a = 0, b = 1) => Math.max(a, Math.min(b, x));
const easeOut = x => 1 - Math.pow(1 - clamp(x), 3);
const easeIn = x => Math.pow(clamp(x), 3);
const backOut = x => { x = clamp(x); const c = 1.9; return 1 + (c + 1) * Math.pow(x - 1, 3) + c * Math.pow(x - 1, 2); };
function rand(seed) { const x = Math.sin(seed * 12.9898) * 43758.5453; return x - Math.floor(x); }

// Parse "*highlighted*" markup into words with a highlight flag.
function words(text) {
  const out = []; let hi = false;
  for (const part of text.split(/(\*)/)) {
    if (part === '*') { hi = !hi; continue; }
    for (const w of part.split(/\s+/)) { if (!w) continue; if (/^[.,!?;:]+$/.test(w) && out.length) out[out.length - 1].w += w; else out.push({ w, hi }); }
  }
  return out;
}

// Lay out words into lines that fit maxW. Returns [{line:[{w,hi,x,width}], width}]
function layout(text, size, maxW, weight = 800) {
  ctx.font = `${weight} ${size}px ${FONT}`;
  const space = ctx.measureText(' ').width;
  const lines = []; let cur = [], curW = 0;
  for (const wd of words(text)) {
    const ww = ctx.measureText(wd.w).width;
    if (cur.length && curW + space + ww > maxW) { lines.push({ line: cur, width: curW }); cur = []; curW = 0; }
    wd.x = cur.length ? curW + space : 0; wd.width = ww;
    curW = wd.x + ww; cur.push(wd);
  }
  if (cur.length) lines.push({ line: cur, width: curW });
  return lines;
}

// Animated word-by-word text. Returns bottom y.
function drawText(text, opts, lt) {
  const { x = SAFE.left, y, size = 92, maxW = SAFE.right - SAFE.left, align = 'left',
          delay = 0, stagger = 0.06, weight = 800, color = C.ink, hiColor = C.acc, lh = 1.12, box = true } = opts;
  const lines = layout(text, size, maxW, weight);
  ctx.font = `${weight} ${size}px ${FONT}`;
  ctx.textBaseline = 'alphabetic';
  let i = 0, yy = y;
  for (const L of lines) {
    const ox = align === 'center' ? x + (maxW - L.width) / 2 : x;
    for (const wd of L.line) {
      const p = clamp((lt - delay - i * stagger) / 0.28);
      if (p > 0) {
        const s = 0.6 + 0.4 * backOut(p);
        const wx = ox + wd.x, wy = yy + size;
        ctx.save();
        ctx.globalAlpha = clamp(p * 2);
        ctx.translate(wx + wd.width / 2, wy - size * 0.35);
        ctx.scale(s, s);
        ctx.translate(-(wx + wd.width / 2), -(wy - size * 0.35));
        if (wd.hi && box) {
          ctx.fillStyle = hiColor;
          const pad = size * 0.12;
          roundRect(wx - pad, wy - size * 0.86, wd.width + pad * 2, size * 1.08, size * 0.14);
          ctx.fill();
          ctx.fillStyle = C.paper;
        } else {
          ctx.fillStyle = wd.hi ? hiColor : color;
        }
        ctx.shadowColor = 'rgba(0,0,0,0.35)'; ctx.shadowBlur = wd.hi && box ? 0 : 18;
        ctx.fillText(wd.w, wx, wy);
        ctx.restore();
      }
      i++;
    }
    yy += size * lh + (lines.some(l => l.line.some(w => w.hi)) && box ? size * 0.1 : 0);
  }
  return yy;
}

function roundRect(x, y, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x + r, y); ctx.arcTo(x + w, y, x + w, y + h, r); ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r); ctx.closePath();
}

// ---------- background ----------
function background(t) {
  const g = ctx.createLinearGradient(0, 0, W, H);
  g.addColorStop(0, C.bg1); g.addColorStop(1, C.bg2);
  ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
  const bx = W * 0.75 + Math.sin(t * 0.4) * 120, by = H * 0.3 + Math.cos(t * 0.3) * 200;
  const rg = ctx.createRadialGradient(bx, by, 0, bx, by, 900);
  rg.addColorStop(0, 'rgba(224,49,42,0.16)'); rg.addColorStop(1, 'rgba(224,49,42,0)');
  ctx.fillStyle = rg; ctx.fillRect(0, 0, W, H);
  // faint ruled lines like a file card
  ctx.strokeStyle = 'rgba(237,230,211,0.035)'; ctx.lineWidth = 2;
  const off = (t * 30) % 72;
  for (let y = -72 + off; y < H; y += 72) { ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(W, y); ctx.stroke(); }
  ctx.strokeStyle = 'rgba(224,49,42,0.12)'; ctx.beginPath(); ctx.moveTo(60, 0); ctx.lineTo(60, H); ctx.stroke();
}

function chrome(t) {
  // progress bar
  ctx.fillStyle = 'rgba(237,230,211,0.15)'; ctx.fillRect(0, 0, W, 10);
  ctx.fillStyle = C.acc; ctx.fillRect(0, 0, W * clamp(t / total), 10);
  // brand label: [mark] DAILY [DROP]
  const x = SAFE.left, y = 150;
  dropMark(x, y + 2, 52, t);
  ctx.font = `700 40px ${FONT}`; ctx.fillStyle = C.ink; ctx.fillText('DAILY', x + 68, y + 46);
  const dw = ctx.measureText('DAILY ').width, pw = ctx.measureText('DROP').width + 16;
  ctx.fillStyle = C.acc; ctx.fillRect(x + 68 + dw, y + 6, pw, 50);
  ctx.fillStyle = C.paper; ctx.fillText('DROP', x + 76 + dw, y + 46);
  ctx.font = `400 28px ${TYPE}`; ctx.fillStyle = C.dim;
  ctx.fillText((story.date || '').toUpperCase(), x + 68 + dw + pw + 22, y + 44);
}

// Channel mark: red drop with two paper redaction bars (same as brand/brand.html)
const DROP = new Path2D('M50 4 C50 4 90 47 90 70 A40 40 0 0 1 10 70 C10 47 50 4 50 4 Z');
function dropMark(x, y, size, t, drop = C.acc, bars = C.paper) {
  ctx.save(); ctx.translate(x, y); ctx.scale(size / 100, size / 100);
  ctx.fillStyle = drop; ctx.fill(DROP);
  ctx.fillStyle = bars; ctx.fillRect(18, 60, 64, 12); ctx.fillRect(26, 78, 40, 8);
  ctx.restore();
}

// ---------- icons ----------
function icon(name, cx, cy, s, lt, sc = {}) {
  const p = backOut(lt / 0.5);
  ctx.save(); ctx.translate(cx, cy); ctx.scale(p, p);
  ctx.lineWidth = 16; ctx.lineCap = 'round'; ctx.lineJoin = 'round';
  if (name === 'glasses') {
    const bob = Math.sin(lt * 3) * 8; ctx.translate(0, bob);
    ctx.strokeStyle = C.ink;
    roundRect(-s, -s * 0.32, s * 0.86, s * 0.62, s * 0.18); ctx.stroke();
    roundRect(s * 0.14, -s * 0.32, s * 0.86, s * 0.62, s * 0.18); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(-s * 0.14, -s * 0.12); ctx.quadraticCurveTo(0, -s * 0.26, s * 0.14, -s * 0.12); ctx.stroke();
    // tiny camera dot (the "smart" bit)
    ctx.fillStyle = C.hot; ctx.beginPath(); ctx.arc(s * 0.86, -s * 0.38, 16, 0, 7); ctx.fill();
    ctx.globalAlpha = 0.5 + 0.5 * Math.sin(lt * 10);
    ctx.beginPath(); ctx.arc(s * 0.86, -s * 0.38, 30, 0, 7); ctx.strokeStyle = C.hot; ctx.lineWidth = 5; ctx.stroke();
    ctx.globalAlpha = 1;
    // AI text in lenses
    ctx.font = `900 ${s * 0.3}px ${FONT}`; ctx.textAlign = 'center'; ctx.fillStyle = C.cool;
    ctx.globalAlpha = clamp((lt - 0.6) * 3);
    ctx.fillText('A', -s * 0.57, s * 0.1); ctx.fillText('I', s * 0.57, s * 0.1);
    ctx.globalAlpha = 1; ctx.textAlign = 'left';
    // scanning beam
    const sy = -s * 0.5 + ((lt * 0.9) % 1) * s;
    const g = ctx.createLinearGradient(0, sy - 40, 0, sy + 40);
    g.addColorStop(0, 'rgba(59,255,157,0)'); g.addColorStop(0.5, 'rgba(59,255,157,0.85)'); g.addColorStop(1, 'rgba(59,255,157,0)');
    ctx.fillStyle = g; ctx.fillRect(-s * 1.2, sy - 40, s * 2.4, 80);
    ctx.strokeStyle = C.ok; ctx.lineWidth = 6;
    const k = s * 1.25, m = s * 0.75, L = 70;
    for (const [x, y, dx, dy] of [[-k, -m, 1, 1], [k, -m, -1, 1], [-k, m, 1, -1], [k, m, -1, -1]]) {
      ctx.beginPath(); ctx.moveTo(x + dx * L, y); ctx.lineTo(x, y); ctx.lineTo(x, y + dy * L); ctx.stroke();
    }
  } else if (name === 'calendar') {
    ctx.fillStyle = '#fff'; roundRect(-s * 0.6, -s * 0.55, s * 1.2, s * 1.15, 40); ctx.fill();
    ctx.fillStyle = C.hot; roundRect(-s * 0.6, -s * 0.55, s * 1.2, s * 0.34, 40); ctx.fill();
    ctx.fillRect(-s * 0.6, -s * 0.35, s * 1.2, s * 0.14);
    ctx.fillStyle = '#0B0F1E'; ctx.textAlign = 'center';
    ctx.font = `900 ${s * 0.62}px ${FONT}`; ctx.fillText(sc.day || '19', 0, s * 0.42);
    ctx.font = `900 ${s * 0.17}px ${FONT}`; ctx.fillStyle = '#fff'; ctx.fillText(sc.month || 'NOV', 0, -s * 0.31);
    ctx.textAlign = 'left';
    ctx.strokeStyle = '#ddd'; ctx.lineWidth = 18;
    for (const x of [-s * 0.3, s * 0.3]) { ctx.beginPath(); ctx.moveTo(x, -s * 0.7); ctx.lineTo(x, -s * 0.45); ctx.stroke(); }
  } else if (name === 'chip') {
    // AI chip with pulsing traces
    ctx.strokeStyle = C.cool; ctx.lineWidth = 10;
    for (let i = -2; i <= 2; i++) {
      const o = i * s * 0.17, pulse = ((lt * 1.5 + i * 0.2) % 1);
      for (const [x1, y1, x2, y2] of [[o, -s * 0.45, o, -s * 0.75], [o, s * 0.45, o, s * 0.75], [-s * 0.45, o, -s * 0.75, o], [s * 0.45, o, s * 0.75, o]]) {
        ctx.globalAlpha = 0.5; ctx.beginPath(); ctx.moveTo(x1, y1); ctx.lineTo(x2, y2); ctx.stroke();
        ctx.globalAlpha = 1; ctx.fillStyle = C.cool; ctx.beginPath();
        ctx.arc(x1 + (x2 - x1) * pulse, y1 + (y2 - y1) * pulse, 9, 0, 7); ctx.fill();
      }
    }
    ctx.fillStyle = '#1d2236'; roundRect(-s * 0.5, -s * 0.5, s, s, 40); ctx.fill();
    ctx.strokeStyle = C.acc; ctx.lineWidth = 12; roundRect(-s * 0.5, -s * 0.5, s, s, 40); ctx.stroke();
    ctx.fillStyle = C.acc; ctx.textAlign = 'center'; ctx.font = `900 ${s * 0.38}px ${FONT}`;
    ctx.fillText(sc.chipText || 'AI', 0, s * 0.13); ctx.textAlign = 'left';
  } else if (name === 'chartdown') {
    // red line chart crashing down
    const pts = [[-1, -0.45], [-0.6, -0.55], [-0.25, -0.2], [0.05, -0.32], [0.4, 0.15], [0.7, 0.05], [1, 0.55]];
    const q = clamp(lt / 1.1);
    ctx.strokeStyle = 'rgba(255,255,255,0.15)'; ctx.lineWidth = 4;
    for (let g = -0.6; g <= 0.6; g += 0.3) { ctx.beginPath(); ctx.moveTo(-s, g * s); ctx.lineTo(s, g * s); ctx.stroke(); }
    ctx.strokeStyle = C.hot; ctx.lineWidth = 18; ctx.shadowColor = C.hot; ctx.shadowBlur = 30;
    ctx.beginPath();
    const n = pts.length - 1, upto = q * n;
    for (let i = 0; i <= Math.floor(upto); i++) { const [x, y] = pts[i]; i ? ctx.lineTo(x * s, y * s) : ctx.moveTo(x * s, y * s); }
    const i0 = Math.min(Math.floor(upto), n - 1), f = upto - i0;
    const ex = pts[i0][0] + (pts[i0 + 1][0] - pts[i0][0]) * f, ey = pts[i0][1] + (pts[i0 + 1][1] - pts[i0][1]) * f;
    ctx.lineTo(ex * s, ey * s); ctx.stroke(); ctx.shadowBlur = 0;
    ctx.fillStyle = C.hot; ctx.beginPath(); ctx.arc(ex * s, ey * s, 22, 0, 7); ctx.fill();
  } else if (name === 'alert') {
    const shake = Math.sin(lt * 40) * 6 * clamp(1 - (lt - 0.4) * 1.5);
    ctx.rotate(shake * 0.01);
    ctx.fillStyle = C.hot; ctx.beginPath();
    ctx.moveTo(0, -s * 0.6); ctx.lineTo(s * 0.68, s * 0.55); ctx.lineTo(-s * 0.68, s * 0.55); ctx.closePath();
    ctx.lineWidth = 40; ctx.strokeStyle = C.hot; ctx.stroke(); ctx.fill();
    ctx.fillStyle = '#fff'; ctx.textAlign = 'center'; ctx.font = `900 ${s * 0.8}px ${FONT}`;
    ctx.fillText('!', 0, s * 0.45); ctx.textAlign = 'left';
  }
  ctx.restore();
}

// ---------- scenes ----------
const SCENES = {
  hook(sc, lt) {
    icon(sc.icon, W / 2, 560, 300, lt, sc);
    kicker(sc.kicker, 900, lt, C.hot);
    drawText(sc.text, { y: 960, size: 104, delay: 0.25, stagger: 0.09 }, lt);
  },
  big(sc, lt) {
    icon(sc.icon, W / 2, 540, 260, lt, sc);
    kicker(sc.kicker, 860, lt, C.cool);
    const p = backOut((lt - 0.2) / 0.4);
    ctx.save(); ctx.globalAlpha = clamp((lt - 0.2) * 4);
    ctx.font = `900 ${fitSize(sc.big, 150, SAFE.right - SAFE.left)}px ${FONT}`;
    ctx.translate(SAFE.left, 1050); ctx.scale(1, p);
    ctx.fillStyle = C.acc; ctx.shadowColor = C.acc + '88'; ctx.shadowBlur = 40;
    ctx.fillText(sc.big, 0, 0); ctx.restore();
    drawText(sc.text, { y: 1110, size: 64, weight: 700, delay: 0.6, stagger: 0.045, color: C.ink }, lt);
  },
  list(sc, lt) {
    if (sc.bg) { kenBurns(sc, IMG[sc.bg], lt); ctx.fillStyle = 'rgba(11,11,12,0.62)'; ctx.fillRect(0, 0, W, H); grade(1); }
    let y = drawText(sc.title, { y: 360, size: 84, delay: 0, stagger: 0.05 }, lt) + 50;
    const n = sc.items.length, step = Math.min(1.0, (sc.dur - 1.6) / n);
    sc.items.forEach((it, i) => {
      const d = 0.9 + i * step, p = easeOut((lt - d) / 0.35);
      if (p <= 0) return;
      ctx.save(); ctx.globalAlpha = p; ctx.translate((1 - p) * -120, 0);
      const sz = 56, tw = SAFE.right - SAFE.left - 190;
      const nl = layout(it, sz, tw, 750).length, bh = Math.max(150, nl * sz * 1.15 + 64);
      ctx.fillStyle = 'rgba(255,255,255,0.08)'; roundRect(SAFE.left, y, SAFE.right - SAFE.left, bh, 30); ctx.fill();
      const mx = SAFE.left + 75, my = y + bh / 2;
      ctx.fillStyle = sc.mark === 'x' ? C.hot : sc.mark === 'dot' ? C.acc : C.ok; ctx.beginPath(); ctx.arc(mx, my, sc.mark === 'dot' ? 22 : 44, 0, 7); ctx.fill();
      ctx.strokeStyle = C.bg1; ctx.lineWidth = 12; ctx.lineCap = 'round'; ctx.beginPath();
      const q = clamp((lt - d - 0.15) / 0.25);
      if (sc.mark === 'dot') {
      } else if (sc.mark === 'x') {
        ctx.moveTo(mx - 18, my - 18); ctx.lineTo(mx - 18 + 36 * q, my - 18 + 36 * q);
        if (q > 0.5) { ctx.moveTo(mx + 18, my - 18); ctx.lineTo(mx + 18 - 36 * (q - 0.5) * 2, my - 18 + 36 * (q - 0.5) * 2); }
      } else {
        ctx.moveTo(mx - 20, my + 2); ctx.lineTo(mx - 6, my + 16 * Math.min(1, q * 2));
        if (q > 0.5) ctx.lineTo(mx - 6 + 28 * (q - 0.5) * 2, my + 16 - 36 * (q - 0.5) * 2);
      }
      ctx.stroke(); ctx.restore();
      ctx.save(); ctx.globalAlpha = p; ctx.translate((1 - p) * -120, 0);
      drawText(it, { x: SAFE.left + 150, y: y + bh / 2 - nl * sz * 1.15 / 2 - sz * 0.12, size: sz, lh: 1.15, weight: 750, delay: d, stagger: 0, box: false, maxW: tw }, lt);
      ctx.restore();
      y += bh + 25;
    });
  },
  stamp(sc, lt) {
    drawText(sc.title, { y: 420, size: 96, delay: 0, stagger: 0.07 }, lt);
    const d = 0.8, p = clamp((lt - d) / 0.22);
    if (p > 0) {
      const s = 2.6 - 1.6 * easeIn(p) ;
      ctx.save(); ctx.translate(W / 2 - 40, 900); ctx.rotate(-0.12); ctx.scale(s, s);
      ctx.globalAlpha = clamp(p * 1.5);
      ctx.font = `400 ${fitSize(sc.stamp, 130, 700, 400)}px "Black Ops One"`; const tw = ctx.measureText(sc.stamp).width;
      ctx.strokeStyle = C.hot; ctx.lineWidth = 14; roundRect(-tw / 2 - 40, -110, tw + 80, 160, 20); ctx.stroke();
      ctx.fillStyle = C.hot; ctx.textAlign = 'center'; ctx.fillText(sc.stamp, 0, 20);
      ctx.restore();
      // impact flash + shake
      if (p >= 1 && lt - d < 0.45) {
        ctx.fillStyle = `rgba(255,59,92,${0.35 * (1 - (lt - d - 0.22) / 0.23)})`; ctx.fillRect(0, 0, W, H);
      }
    }
    drawText(sc.text, { y: 1110, size: 72, weight: 800, delay: 1.5, stagger: 0.06 }, lt);
  },
  photo(sc, lt) {
    kenBurns(sc, IMG[sc.img], lt); grade(sc.grade ?? 1);
    headline(sc, lt);
    if (sc.label) nameTag(sc.label.name, sc.label.role, SAFE.left, 1080, lt, 0.5);
    credit(sc.credit);
  },
  trio(sc, lt) {
    // three portraits as vertical panels sliding in one after another
    const n = sc.people.length, pw = W / n;
    sc.people.forEach((p, i) => {
      const d = 0.12 * i, q = easeOut((lt - d) / 0.45);
      if (q <= 0) return;
      ctx.save(); ctx.beginPath(); ctx.rect(i * pw, 0, pw + 1, H); ctx.clip();
      ctx.translate(0, (1 - q) * (i % 2 ? -1 : 1) * 500); ctx.globalAlpha *= q;
      const z = 1.1 + 0.08 * clamp(lt / sc.dur);
      drawCover(IMG[p.img], i * pw, 0, pw, H, p.focus || [0.5, 0.35], z);
      ctx.restore();
    });
    grade(1);
    ctx.fillStyle = C.bg1; for (let i = 1; i < n; i++) ctx.fillRect(i * pw - 4, 0, 8, H);
    sc.people.forEach((p, i) => {
      const q = easeOut((lt - 0.5 - 0.12 * i) / 0.3); if (q <= 0) return;
      ctx.save(); ctx.globalAlpha *= q; ctx.font = `900 ${fitSize(p.name, 46, pw - 30)}px ${FONT}`; ctx.textAlign = 'center';
      ctx.fillStyle = C.acc; ctx.fillRect(i * pw + 30, 1118, pw - 60, 6);
      ctx.fillStyle = '#fff'; ctx.fillText(p.name, i * pw + pw / 2, 1100); ctx.restore();
    });
    headline(sc, lt);
    credit(sc.credit);
  },
  cta(sc, lt) {
    if (sc.bg) { kenBurns(sc, IMG[sc.bg], lt); ctx.fillStyle = 'rgba(11,11,12,0.55)'; ctx.fillRect(0, 0, W, H); grade(1); }
    drawText(sc.text, { y: 420, size: 108, delay: 0, stagger: 0.08 }, lt);
    // comment bubble
    const p = backOut((lt - 1.2) / 0.4);
    if (p > 0) {
      ctx.save(); ctx.translate(W / 2 - 40, 1060); ctx.scale(p, p);
      ctx.fillStyle = '#fff'; roundRect(-330, -80, 660, 160, 80); ctx.fill();
      ctx.beginPath(); ctx.moveTo(-180, 70); ctx.lineTo(-230, 140); ctx.lineTo(-110, 76); ctx.fill();
      ctx.fillStyle = C.bg1; ctx.font = `400 46px ${TYPE}`; ctx.textAlign = 'center';
      ctx.fillText(sc.sub, 0, 18);
      ctx.restore();
    }
    const q = easeOut((lt - 2.0) / 0.5);
    if (q > 0) {
      ctx.save(); ctx.globalAlpha = q;
      ctx.font = `800 50px ${FONT}`; ctx.fillStyle = C.acc; ctx.textAlign = 'center';
      ctx.fillText(sc.follow, W / 2 - 40, 1330 + (1 - q) * 40);
      ctx.font = `900 60px ${FONT}`;
      ctx.fillText('↓', W / 2 - 40, 1420 + Math.sin(lt * 6) * 12);
      ctx.restore();
    }
  }
};

function kicker(label, y, lt, col) {
  if (!label) return;
  const p = easeOut(lt / 0.3);
  ctx.font = `400 40px ${TYPE}`;
  const w = ctx.measureText(label).width + 44;
  ctx.save(); ctx.globalAlpha = p;
  ctx.fillStyle = col; ctx.fillRect(SAFE.left, y, w * p, 64);
  ctx.fillStyle = col === C.hot ? C.paper : C.bg1; ctx.fillText(label, SAFE.left + 22, y + 46);
  ctx.restore();
}

function fitSize(text, size, maxW, weight = 900) {
  ctx.font = `${weight} ${size}px ${FONT}`;
  const w = ctx.measureText(text).width;
  return w > maxW ? Math.floor(size * maxW / w) : size;
}

function render(t) {
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.globalAlpha = 1; ctx.shadowBlur = 0;
  background(t);
  let i = starts.length - 1;
  while (i > 0 && t < starts[i]) i--;
  const sc = story.scenes[i], lt = t - starts[i];
  // scene transition: punch-in at start, quick fade at end
  const inP = easeOut(lt / 0.25), outP = clamp((sc.dur - lt) / 0.18);
  ctx.save();
  const z = 1.06 - 0.06 * inP;
  ctx.translate(W / 2, H / 2); ctx.scale(z, z); ctx.translate(-W / 2, -H / 2);
  ctx.globalAlpha = Math.min(inP, outP);
  SCENES[sc.type](sc, lt);
  ctx.restore();
  captions(sc, lt);
  grain(t);
  // white flash on cut
  if (lt < 0.08 && i > 0) { ctx.fillStyle = `rgba(255,255,255,${0.25 * (1 - lt / 0.08)})`; ctx.fillRect(0, 0, W, H); }
  chrome(t);
}

window.init = init; window.render = render;
window.frame = (t, q) => { render(t); return document.getElementById('c').toDataURL('image/jpeg', q || 0.92); };
</script>
</body>
