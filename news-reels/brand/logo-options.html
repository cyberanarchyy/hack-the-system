<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../fonts/fonts.css"><style>
body{margin:0;background:#1a1a1a;display:flex;flex-wrap:wrap;gap:30px;padding:30px;width:1700px}
.o{width:520px;height:520px;background:#0B0B0C;position:relative;display:grid;place-items:center;overflow:hidden}
.n{position:absolute;top:12px;left:16px;color:#888;font:14px monospace}
</style></head><body>
<!-- A: drop with redaction bar -->
<div class="o"><div class="n">A</div><div style="text-align:center">
<svg width="220" height="246" viewBox="0 0 100 112"><path fill="#EDE6D3" d="M50 4 C50 4 90 47 90 70 A40 40 0 0 1 10 70 C10 47 50 4 50 4 Z"/><rect x="2" y="60" width="96" height="16" fill="#0B0B0C"/><rect x="6" y="63" width="88" height="10" fill="#0B0B0C"/><circle cx="84" cy="20" r="10" fill="#D7261E"/></svg>
<div style="font:700 92px Oswald;color:#EDE6D3;letter-spacing:2px;line-height:1">DAILY <span style="background:#D7261E;color:#EDE6D3;padding:0 10px">DROP</span></div></div></div>
<!-- B: stamp roundel -->
<div class="o"><div class="n">B</div>
<div style="width:400px;height:400px;border:14px solid #D7261E;border-radius:50%;display:grid;place-items:center;transform:rotate(-12deg);position:relative">
<div style="position:absolute;inset:18px;border:4px solid #D7261E;border-radius:50%"></div>
<div style="text-align:center;color:#D7261E"><div style="font:400 30px 'Special Elite';letter-spacing:6px">★ CASE FILE ★</div><div style="font:400 96px 'Black Ops One';line-height:.95">DAILY<br>DROP</div><div style="font:400 30px 'Special Elite';letter-spacing:6px">DECLASSIFIED</div></div></div></div>
<!-- C: redacted wordmark -->
<div class="o"><div class="n">C</div><div style="width:440px">
<div style="font:400 28px 'Special Elite';color:#D7261E;letter-spacing:4px">FILE NO. 001 — TOP SECRET</div>
<div style="font:700 150px Oswald;color:#EDE6D3;line-height:.9;letter-spacing:1px">DAILY</div>
<div style="position:relative;font:700 150px Oswald;color:#EDE6D3;line-height:.9"><span>DROP</span><div style="position:absolute;left:-8px;right:110px;top:62px;height:46px;background:#0B0B0C;outline:6px solid #0B0B0C"></div></div>
<div style="height:12px;background:#D7261E;margin-top:14px;width:300px"></div></div></div>
<!-- D: folder tab + drop -->
<div class="o"><div class="n">D</div><div style="position:relative;width:420px;height:300px">
<div style="position:absolute;left:0;top:0;width:170px;height:50px;background:#C9B98F;border-radius:10px 10px 0 0"></div>
<div style="position:absolute;left:0;top:40px;width:420px;height:260px;background:#D9CBA3;border-radius:0 10px 10px 10px;display:grid;place-items:center">
<div style="text-align:center"><div style="font:700 110px Oswald;color:#0B0B0C;line-height:.9">DAILY DROP</div>
<div style="display:inline-block;margin-top:14px;border:5px solid #D7261E;color:#D7261E;font:400 40px 'Black Ops One';padding:2px 16px;transform:rotate(-6deg)">CLASSIFIED</div></div></div></div></div>
<!-- E: drop mark only (avatar) -->
<div class="o" style="background:#D7261E"><div class="n" style="color:#fff">E</div>
<svg width="300" height="336" viewBox="0 0 100 112"><path fill="#0B0B0C" d="M50 4 C50 4 90 47 90 70 A40 40 0 0 1 10 70 C10 47 50 4 50 4 Z"/><rect x="18" y="62" width="64" height="12" fill="#EDE6D3"/><rect x="26" y="80" width="40" height="8" fill="#EDE6D3"/></svg></div>
<!-- F: typewriter + bars -->
<div class="o" style="background:#EDE6D3"><div class="n">F</div><div style="width:440px;color:#0B0B0C">
<div style="font:400 34px 'Special Elite'">SUBJECT:</div>
<div style="font:700 130px Oswald;line-height:.9">DAILY</div><div style="font:700 130px Oswald;line-height:.9;color:#D7261E">DROP</div>
<div style="margin-top:18px;height:22px;background:#0B0B0C;width:380px"></div><div style="margin-top:10px;height:22px;background:#0B0B0C;width:260px"></div>
<div style="font:400 26px 'Special Elite';margin-top:14px">THE TRUTH, ONE FILE AT A TIME.</div></div></div>
</body></html>
