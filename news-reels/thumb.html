<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="fonts/fonts.css"><style>
*{margin:0;box-sizing:border-box} body{width:1280px;height:720px;overflow:hidden;background:#0B0B0C}
#t{position:relative;width:1280px;height:720px;overflow:hidden}
#bg{position:absolute;inset:0;background-size:cover;background-position:var(--pos,50% 45%);filter:grayscale(.85) contrast(1.3) brightness(.7) sepia(.15)}
#tint{position:absolute;inset:0;background:linear-gradient(90deg,rgba(11,11,12,.96) 0%,rgba(11,11,12,.82) 50%,rgba(11,11,12,.1) 80%),radial-gradient(circle at 78% 50%,rgba(224,49,42,.28),transparent 55%)}
#txt{position:absolute;left:56px;top:60px;width:760px}
.k{display:inline-block;background:#E0312A;color:#EDE6D3;font:400 36px "Special Elite";padding:6px 18px;letter-spacing:.08em}
.big{font:700 160px Oswald;line-height:1.02;color:#EDE6D3;margin-top:28px;text-transform:uppercase;text-shadow:0 8px 40px rgba(0,0,0,.7)}
.big b{background:#E0312A;padding:0 .08em;font-weight:700;display:inline-block;line-height:.98;margin:.04em 0}
.sub{font:700 60px Oswald;line-height:1.02;color:#EDE6D3;margin-top:16px;text-transform:uppercase;text-shadow:0 6px 30px rgba(0,0,0,.8)}
.bar{display:inline-block;background:#0B0B0C;height:.8em;vertical-align:-.05em;width:var(--w,4em);outline:4px solid #0B0B0C}
#stamp{position:absolute;right:56px;bottom:60px;transform:rotate(-10deg);border:8px solid #E0312A;color:#E0312A;font:400 72px "Black Ops One";padding:0 26px;outline:3px solid #E0312A;outline-offset:6px;background:rgba(11,11,12,.35)}
svg{position:absolute;right:28px;top:24px}
</style></head><body><div id="t"><div id="bg"></div><div id="tint"></div><div id="txt"><div class="k" id="k"></div><div class="big" id="big"></div><div class="sub" id="sub"></div></div><div id="stamp"></div>
<svg width="64" height="72" viewBox="0 0 100 112"><path fill="#E0312A" d="M50 4 C50 4 90 47 90 70 A40 40 0 0 1 10 70 C10 47 50 4 50 4 Z"/><rect x="18" y="60" width="64" height="12" fill="#EDE6D3"/><rect x="26" y="78" width="40" height="8" fill="#EDE6D3"/></svg></div>
<script>const q=JSON.parse(decodeURIComponent(location.hash.slice(1)));document.getElementById('bg').style.backgroundImage=`url(${q.img})`;if(q.pos)document.getElementById('bg').style.setProperty('--pos',q.pos);for(const k of['k','big','sub','stamp'])document.getElementById(k).innerHTML=q[k]||'';if(!q.stamp)document.getElementById('stamp').remove();if(!q.k)document.getElementById('k').remove();</script></body></html>
