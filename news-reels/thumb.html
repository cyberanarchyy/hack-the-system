<!DOCTYPE html><html><head><meta charset="utf-8"><style>
*{margin:0;box-sizing:border-box} body{width:1280px;height:720px;overflow:hidden;font-family:"Inter Display","Inter",sans-serif;background:#000}
#t{position:relative;width:1280px;height:720px;overflow:hidden}
#bg{position:absolute;inset:0;background-size:cover;background-position:var(--pos,50% 45%);filter:grayscale(.6) contrast(1.25) brightness(.75)}
#tint{position:absolute;inset:0;background:linear-gradient(90deg,rgba(10,13,24,.92) 0%,rgba(10,13,24,.6) 45%,rgba(10,13,24,0) 75%),radial-gradient(circle at 75% 55%,rgba(255,80,20,.35),transparent 50%)}
#txt{position:absolute;left:60px;top:70px;width:720px}
.k{display:inline-block;background:#FF3B3B;color:#fff;font-weight:900;font-size:40px;padding:6px 20px;border-radius:8px;letter-spacing:.02em}
.big{font-weight:900;font-size:150px;line-height:.95;color:#FFD43B;text-shadow:0 8px 40px rgba(0,0,0,.7);margin-top:18px;letter-spacing:-.02em}
.sub{font-weight:900;font-size:62px;line-height:1.02;color:#fff;margin-top:18px;text-shadow:0 6px 30px rgba(0,0,0,.8)}
svg{position:absolute;right:30px;bottom:24px}
</style></head><body><div id="t"><div id="bg"></div><div id="tint"></div><div id="txt"><div class="k" id="k"></div><div class="big" id="big"></div><div class="sub" id="sub"></div></div>
<svg width="70" height="78" viewBox="0 0 100 112"><path fill="#FFD43B" d="M50 4 C50 4 90 47 90 70 A40 40 0 0 1 10 70 C10 47 50 4 50 4 Z"/><g fill="none" stroke="#0B0F1E" stroke-width="6" stroke-linecap="round"><circle cx="50" cy="72" r="23"/><ellipse cx="50" cy="72" rx="10" ry="23"/><path d="M27 72 H73"/></g><circle cx="84" cy="20" r="11" fill="#FF3B5C" stroke="#0B0F1E" stroke-width="5"/></svg></div>
<script>const q=JSON.parse(decodeURIComponent(location.hash.slice(1)));document.getElementById('bg').style.backgroundImage=`url(${q.img})`;if(q.pos)document.getElementById('bg').style.setProperty('--pos',q.pos);for(const k of['k','big','sub'])document.getElementById(k).innerHTML=q[k]||'';</script></body></html>
