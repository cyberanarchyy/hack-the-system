<!doctype html><html><head><meta charset="utf-8"><style>
@font-face{font-family:D;src:url(../../clip-heist/assets/fonts/display-900.woff2)}
@font-face{font-family:T;src:url(../../clip-heist/assets/fonts/inter-600.woff2)}
html,body{margin:0;width:1080px;height:1920px;overflow:hidden;background:transparent;font-family:D,sans-serif}
#s{position:absolute;inset:0}
.abs{position:absolute;left:0;right:0;text-align:center}
.w{font-weight:900;color:#fff;letter-spacing:-2px;line-height:.95;text-transform:uppercase;-webkit-text-stroke:0}
.sh{text-shadow:0 8px 0 rgba(0,0,0,.55),0 0 40px rgba(0,0,0,.6)}
.grad{background:linear-gradient(90deg,#ff3ea5,#ff8a3d);-webkit-background-clip:text;color:transparent;text-shadow:none;filter:drop-shadow(0 7px 0 rgba(0,0,0,.6))}
.gold{color:#ffd23f}
.pill{display:inline-block;padding:18px 36px;border-radius:999px;background:rgba(10,10,16,.85);border:3px solid rgba(255,255,255,.15);font-family:T;font-size:44px;color:#fff;letter-spacing:0}
.card{position:absolute;left:90px;right:90px;border-radius:44px;background:rgba(12,12,20,.92);border:2px solid rgba(255,255,255,.12);box-shadow:0 30px 80px rgba(0,0,0,.6);padding:44px 50px;font-family:T;color:#fff}
.stat{display:flex;justify-content:space-between;align-items:center;padding:22px 0;border-bottom:2px solid rgba(255,255,255,.08);font-size:46px}
.stat b{font-family:D;font-size:64px}
.phone{position:absolute;left:50%;width:560px;height:1212px;margin-left:-280px;border-radius:76px;background:#000;padding:16px;box-shadow:0 0 0 5px #2a2a38,0 40px 120px rgba(255,62,165,.45)}
.phone img{width:100%;height:100%;object-fit:cover;object-position:top;border-radius:60px}
.vign{position:absolute;inset:0;background:radial-gradient(ellipse at 50% 45%,rgba(0,0,0,.35) 30%,rgba(0,0,0,.75) 100%)}
.logo{width:300px;height:300px;margin:0 auto;filter:drop-shadow(0 0 40px rgba(255,62,165,.7))}
.bar{height:26px;border-radius:20px;background:rgba(255,255,255,.12);overflow:hidden;margin-top:16px}
.bar i{display:block;height:100%;background:linear-gradient(90deg,#ff3ea5,#ff8a3d)}
.fade{position:absolute;left:0;right:0;bottom:0;height:900px;background:linear-gradient(180deg,rgba(8,6,14,0),rgba(8,6,14,.85) 45%,#08060e)}
#av{position:absolute;left:90px;top:1000px;width:900px;height:1012px;transform-origin:50% 100%}
#flash{position:absolute;inset:0;background:#fff;opacity:0}
</style></head><body><div id="s"><div class="vign"></div><div class="fade"></div><div id="L"></div><div id="av"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 900" id="avatar" width="900" height="1012">
  <defs>
    <linearGradient id="vis" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#ff3ea5"/><stop offset="1" stop-color="#ff8a3d"/></linearGradient>
    <linearGradient id="hood" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#2a2540"/><stop offset="1" stop-color="#14121f"/></linearGradient>
    <linearGradient id="body" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#262138"/><stop offset="1" stop-color="#0f0d18"/></linearGradient>
    <radialGradient id="face" cx="0.5" cy="0.45" r="0.6"><stop offset="0" stop-color="#1b1828"/><stop offset="1" stop-color="#07060c"/></radialGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="10" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <filter id="soft"><feGaussianBlur stdDeviation="3"/></filter>
  </defs>
  <!-- body / hoodie -->
  <g id="bodyG">
    <path d="M90 900 C 100 700, 210 600, 400 595 C 590 600, 700 700, 710 900 Z" fill="url(#body)"/>
    <path d="M300 610 C 340 680, 460 680, 500 610" fill="none" stroke="#3a3354" stroke-width="10"/>
    <!-- drawstrings -->
    <path d="M360 640 L 352 760" stroke="#ff3ea5" stroke-width="9" stroke-linecap="round"/>
    <path d="M440 640 L 448 760" stroke="#ff8a3d" stroke-width="9" stroke-linecap="round"/>
    <circle cx="352" cy="768" r="9" fill="#ffd23f"/><circle cx="448" cy="768" r="9" fill="#ffd23f"/>
    <!-- pocket line -->
    <path d="M250 860 Q 400 820 550 860" fill="none" stroke="#2f2945" stroke-width="8"/>
  </g>
  <!-- phone in hands -->
  <g id="phoneG" transform="translate(575 735) rotate(-12)">
    <rect x="-70" y="-120" width="150" height="270" rx="26" fill="#0b0b10" stroke="#3a3a4a" stroke-width="6"/>
    <rect x="-58" y="-106" width="126" height="242" rx="18" fill="#140a1c"/>
    <g transform="translate(5 15) scale(0.22) translate(-256 -256)">
      <rect x="166" y="84" width="180" height="344" rx="34" fill="none" stroke="url(#vis)" stroke-width="26"/>
      <path d="M226 196v120l100-60z" fill="url(#vis)"/>
    </g>
    <!-- glove/hand -->
    <path d="M-80 60 C -110 40, -110 110, -60 130 L 20 150 C 40 120, 0 70, -80 60 Z" fill="#1d1a2b" stroke="#2f2945" stroke-width="4"/>
  </g>
  <!-- head -->
  <g id="headG">
    <!-- hood -->
    <path d="M400 70 C 230 70, 160 210, 165 360 C 170 500, 250 600, 400 610 C 550 600, 630 500, 635 360 C 640 210, 570 70, 400 70 Z" fill="url(#hood)"/>
    <!-- face mask (balaclava) -->
    <path d="M400 150 C 290 150, 240 250, 245 360 C 250 470, 310 545, 400 550 C 490 545, 550 470, 555 360 C 560 250, 510 150, 400 150 Z" fill="url(#face)"/>
    <!-- headphones -->
    <path d="M190 330 C 190 120, 610 120, 610 330" fill="none" stroke="#ff3ea5" stroke-width="22" stroke-linecap="round" opacity="0.95"/>
    <rect x="150" y="300" width="70" height="130" rx="30" fill="#ff3ea5"/>
    <rect x="580" y="300" width="70" height="130" rx="30" fill="#ff8a3d"/>
    <rect x="162" y="318" width="20" height="94" rx="10" fill="#ffd23f" opacity="0.8"/>
    <rect x="618" y="318" width="20" height="94" rx="10" fill="#ffd23f" opacity="0.8"/>
    <!-- visor -->
    <g filter="url(#glow)">
      <rect x="262" y="290" width="276" height="92" rx="46" fill="url(#vis)"/>
    </g>
    <rect x="272" y="298" width="256" height="20" rx="10" fill="#fff" opacity="0.28"/>
    <!-- eyes (scaleY for blinks) -->
    <g id="eyes">
      <rect id="eyeL" x="322" y="318" width="44" height="40" rx="20" fill="#16000c"/>
      <rect id="eyeR" x="434" y="318" width="44" height="40" rx="20" fill="#16000c"/>
    </g>
    <!-- LED mouth (equalizer bars) -->
    <g id="mouth" filter="url(#glow)"></g>
  </g>
</svg>
</div></div><div id="flash"></div>
<script>
const ICON=`<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs><linearGradient id="lg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ff3ea5"/><stop offset="1" stop-color="#ff8a3d"/></linearGradient></defs>
  
  <rect x="166" y="84" width="180" height="344" rx="34" fill="none" stroke="url(#lg)" stroke-width="26"/>
  <path d="M226 196v120l100-60z" fill="url(#lg)"/>
  <path d="M96 150l60 40M96 362l60-40M416 150l-60 40M416 362l-60-40" stroke="#ffd23f" stroke-width="20" stroke-linecap="round"/>
</svg>`, SH='shots/';
const P=Object.assign({day:1,followers:0,views:0,earned:0,goal:10000,handle:'@clipheist'},JSON.parse(decodeURIComponent(location.hash.slice(1)||'%7B%7D')));
const cl=(x,a=0,b=1)=>Math.max(a,Math.min(b,x)),pr=(t,a,b)=>cl((t-a)/(b-a));
const ob=(x)=>{const c=1.7;return 1+(c+1)*Math.pow(x-1,3)+c*Math.pow(x-1,2)},oc=(x)=>1-Math.pow(1-x,3);
const pop=(t,a,d=.32)=>{const p=pr(t,a,a+d);return p<=0?0:ob(p)};
const fl=(t,a,l=.2)=>{const d=t-a;return d>=0&&d<l?.75*(1-d/l):0};
const el=(h,s)=>'<div class="abs" style="'+s+'">'+h+'</div>';
const money=(n)=>'£'+Math.round(n).toLocaleString('en-GB');
const num=(n)=>n>=1e6?(n/1e6).toFixed(1)+'M':n>=1e3?(n/1e3).toFixed(1)+'K':String(Math.round(n));
function render(t){let h='',f=0,sx=0,sy=0;
 if(t<3.2){
  const s=t<.35?2.4-1.4*oc(pr(t,0,.35)):1; f=fl(t,.35); if(t>.35&&t<.7){const e=1-(t-.35)/.35;sx=Math.sin(t*90)*24*e;sy=Math.cos(t*70)*18*e}
  h+=el('<div class="w sh" style="font-size:260px">DAY '+P.day+'</div>','top:150px;transform:scale('+s+')');
  h+=el('<div class="w sh" style="font-size:70px;letter-spacing:-1px">of using <span class="grad">Clip Heist</span> to make</div>','top:420px;opacity:'+pr(t,.7,1)+';transform:translateY('+(1-oc(pr(t,.7,1.05)))*40+'px)');
  h+=el('<div class="w sh gold" style="font-size:150px">'+money(P.goal)+'/MO</div>','top:520px;transform:scale('+pop(t,1.2)+')');
  h+=el('<div class="w sh" style="font-size:130px;letter-spacing:4px">CLIPPING</div>','top:700px;opacity:'+pr(t,1.8,2.1)+';transform:scale('+(1+.05*Math.sin(t*6))+')');
  f+=fl(t,1.2,.15);
 } else if(t<7){
  const a=3.2;
  h+=el('<div class="w sh" style="font-size:104px">STARTING FROM</div>','top:110px;transform:scale('+pop(t,a)+')');
  h+=el('<div class="w sh grad" style="font-size:190px">'+(P.day===1?'ZERO':money(P.earned))+'</div>','top:220px;transform:scale('+pop(t,a+.4)+')');
  h+='<div class="card" style="top:'+(450+(1-oc(pr(t,a+.6,a+1.1)))*900)+'px">'+
   '<div style="display:flex;align-items:center;gap:26px;margin-bottom:16px"><div style="width:110px;height:110px;border-radius:99px;background:#1d1d28;display:grid;place-items:center">'+ICON.replace('<svg','<svg width="80" height="80"')+'</div><div><div style="font-family:D;font-size:52px">'+P.handle+'</div><div style="color:#a3a3b8;font-size:36px">Clipping channel · Day '+P.day+'</div></div></div>'+
   '<div class="stat"><span>Followers</span><b>'+num(P.followers*pr(t,a+1,a+2))+'</b></div>'+
   '<div class="stat"><span>Views</span><b>'+num(P.views*pr(t,a+1,a+2))+'</b></div>'+
   '<div class="stat" style="border:0"><span>Earned</span><b style="color:#ffd23f">'+money(P.earned*pr(t,a+1,a+2))+'</b></div></div>';
  f=fl(t,a+.4,.15);
 } else if(t<12.2){
  const a=7;
  h+=el('<div class="w sh" style="font-size:118px">THE <span class="grad">PLAN</span></div>','top:130px;transform:scale('+pop(t,a)+')');
  const steps=['🎮 Clip my favourite streamers &amp; games','💥 Clip Heist finds the best moments','📲 Post 3 clips every day'];
  steps.forEach((s,i)=>{const b=a+.6+i*1.1;h+=el('<div class="pill" style="font-size:48px;padding:26px 40px">'+s+'</div>','top:'+(330+i*170)+'px;opacity:'+cl(pop(t,b))+';transform:translateX('+(1-cl(oc(pr(t,b,b+.35))))*(i%2?700:-700)+'px)')});
  f=fl(t,a,.15);
 } else if(t<15){
  const a=12.2,p=Math.max(.02,P.earned/P.goal);
  h+=el('<div class="w sh" style="font-size:110px">GOAL TRACKER</div>','top:140px;transform:scale('+pop(t,a)+')');
  h+='<div class="card" style="top:'+(330+(1-oc(pr(t,a+.2,a+.6)))*900)+'px"><div style="display:flex;justify-content:space-between;font-size:46px"><span>'+money(P.earned)+'</span><span style="color:#a3a3b8">'+money(P.goal)+'/mo</span></div><div class="bar"><i style="width:'+(p*100*pr(t,a+.6,a+1.6))+'%"></i></div><div style="margin-top:26px;font-size:42px;color:#c4c4d4">Day '+P.day+' of the challenge</div></div>';
  h+=el('<div class="w sh gold" style="font-size:92px">FOLLOW TO SEE<br>IF IT WORKS</div>','top:690px;transform:scale('+pop(t,a+1.3)+')');
  f=fl(t,a,.15);
 } else {
  const a=15;
  h+=el('<div class="logo" style="width:220px;height:220px">'+ICON+'</div>','top:110px;transform:scale('+pop(t,a,.45)+')');
  h+=el('<div class="w sh" style="font-size:130px;letter-spacing:-3px"><span class="grad">CLIP</span> HEIST</div>','top:360px;opacity:'+pr(t,a+.2,a+.5));
  h+=el('<div class="pill">Clip your favourite streamers &amp; games</div>','top:530px;opacity:'+pr(t,a+.5,a+.8));
  h+=el('<div class="w sh gold" style="font-size:84px;letter-spacing:0;text-transform:none">getclipheist.app</div>','top:670px;transform:scale('+pop(t,a+.8)+')');
  h+=el('<div class="w sh" style="font-size:60px;letter-spacing:0;text-transform:none">Day '+(P.day+1)+' tomorrow 👀</div>','top:810px;opacity:'+pr(t,a+1.2,a+1.6));
  f=fl(t,a,.2);
 }
 document.getElementById('L').innerHTML=h;document.getElementById('flash').style.opacity=f;
 document.getElementById('s').style.transform='translate('+sx+'px,'+sy+'px)';
 avatar(t);
}
// ---- avatar: lip-sync from window.AMP (per-frame loudness), blinks, idle bob ----
const AV=document.getElementById('avatar');
function avatar(t){
  const A=window.AMP||[], i=Math.min(A.length-1,Math.max(0,Math.round(t*30))), amp=A.length?A[i]:0;
  const g=AV.querySelector('#mouth'); let m='';
  const n=7,w=16,gap=8,x0=400-(n*w+(n-1)*gap)/2, shape=[.45,.7,.9,1,.9,.7,.45];
  for(let k=0;k<n;k++){const wob=amp>0.08?(0.75+0.25*Math.sin(t*38+k*1.7)):1;const bh=6+Math.min(1,amp)*72*shape[k]*wob;
    m+='<rect x="'+(x0+k*(w+gap))+'" y="'+(470-bh/2)+'" width="'+w+'" height="'+bh+'" rx="8" fill="'+(k<3?'#ff3ea5':k>3?'#ff8a3d':'#ffd23f')+'"/>';}
  g.innerHTML=m;
  const bl=[1.8,5.6,9.3,13.1,16.4].some(b=>t>=b&&t<b+.16);
  AV.querySelectorAll('#eyes rect').forEach(e=>e.setAttribute('transform',bl?'translate(0 338) scale(1 0.12) translate(0 -338)':''));
  const head=AV.querySelector('#headG'), bob=Math.sin(t*2.2)*6+amp*10, tilt=Math.sin(t*1.3)*2.5+(amp>0.3?Math.sin(t*9)*1.5:0);
  head.setAttribute('transform','translate(0 '+(-bob)+') rotate('+tilt+' 400 560)');
  const enter=oc(pr(t,0,.5));
  document.getElementById('av').style.transform='translateY('+((1-enter)*500+Math.sin(t*1.6)*4)+'px)';
}
window.renderFrame=render;
</script></body></html>
